---
# handlers file for ansible-role-base

- name: apt-get update
  ansible.builtin.apt:
    update_cache: yes

- name: ssh restart
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: ntp daemon restart
  ansible.builtin.service:
    name: "{{ base_ntp_package }}"
    state: restarted
  when: base_ntp_enable | bool
