---
- name: Converge
  hosts: all
  become: true
  vars:
    # Set base_ntp_enable: false because docker/podman can not start systemd services
    base_ntp_enable: false
    base_ntp_package: 'chrony'
    base_ntp_server: 'time.example.com prefer iburst'
    base_ntp_allow:
      - "127/8"
      - "192.168.100.0/24"
    base_ntp_ntpsigndsocket: "/var/lib/samba/ntp_signd"

  roles:
    - role: jkirk.base
